<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Réservation - Kim Event</title>
  <link rel="stylesheet" href="reservation.css">
</head>
<body>
  <div class="reservation-container">
    <h1>Formulaire de Réservation</h1>

    <form action="confirmation.php" method="post">
      <label for="nom">Nom complet :</label>
      <input type="text" id="nom" name="nom" placeholder="Entrez votre nom" required>

      <label for="materiel">Matériel à réserver :</label>
      <select id="materiel" name="materiel" required>
        <option value="">-- Sélectionnez --</option>
        <option value="Sonorisation">Sonorisation</option>
        <option value="Mobilier">Mobilier</option>
        <option value="Décoration">Décoration</option>
        <option value="Éclairage">Éclairage</option>
      </select>

      <label for="quantite">Quantité :</label>
      <input type="number" id="quantite" name="quantite" min="1" required>

      <label for="telephone">Numéro de téléphone :</label>
      <input type="tel" id="telephone" name="telephone" placeholder="Ex: 0102030405" required>

      <label for="adresse">Adresse de livraison :</label>
      <input type="text" id="adresse" name="adresse" placeholder="Entrez l'adresse complète" required>

      <label for="date_livraison">Date de livraison :</label>
      <input type="date" id="date_livraison" name="date_livraison" required>

      <button type="submit">Valider la réservation</button>
    </form>

    <a href="index.html" class="back">← Retour à l'accueil</a>
  </div>
</body>
</html>
